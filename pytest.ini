# Audit #10a: pytest discovers exactly what `python manage.py test` runs.
# Zero setup: config/test_settings.py supplies fake secrets and test-only
# defaults, so no .env or environment variables are needed.
[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
# Django's runner matches test*.py; tests*.py and *_tests.py are listed
# explicitly so the intent survives future pattern edits.
python_files = test*.py tests*.py *_tests.py
testpaths =
    accounts
    api
    catalog
    client_calculator
    clients
    common
    config
    contact
    core
    gallery
    inventory
    jobs
    locations
    mpesa_payments
    notifications
    payments
    pricing
    production
    quotes
    services
    setup
    shops
    tests
    workflow
addopts = -p no:cacheprovider
# WhiteNoise warns on every request that STATIC_ROOT (collectstatic output)
# does not exist; tests never serve static files.
filterwarnings =
    ignore:No directory at:UserWarning
